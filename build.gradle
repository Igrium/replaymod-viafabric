plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

repositories {
	maven {
		name = "Modrinth"
		url = "https://api.modrinth.com/maven"
		content { includeGroup "maven.modrinth" }
	}
	maven {
		// ViaVersion / ViaFabricPlus API (not on Maven Central)
		name = "ViaVersion"
		url = "https://repo.viaversion.com"
		content {
			includeGroup "com.viaversion"
			includeGroup "net.raphimc"
		}
	}
	mavenCentral()
}

fabricApi {
	configureTests {
		createSourceSet = true
		modId = "replaymod-viafabric-test"
		enableGameTests = false
		enableClientGameTests = true
		eula = true
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	implementation "maven.modrinth:replaymod:${replaymod_version}"
	implementation "maven.modrinth:viafabricplus:${viafabricplus_version}"

	// ViaFabricPlus ships its API and the Via* libraries as nested jars, which are only visible at runtime.
	// Compile against the matching published artifacts instead.
	compileOnly "com.viaversion:viafabricplus-api:${viafabricplus_version}"
	compileOnly "com.viaversion:viaversion-common:${viaversion_version}"
	testCompileOnly "com.viaversion:viafabricplus-api:${viafabricplus_version}"
	testCompileOnly "com.viaversion:viaversion-common:${viaversion_version}"
	gametestCompileOnly "com.viaversion:viafabricplus-api:${viafabricplus_version}"
	gametestCompileOnly "com.viaversion:viaversion-common:${viaversion_version}"

	testImplementation platform("org.junit:junit-bom:${junit_version}")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
	testImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"
}

def replayFixtures = providers.gradleProperty("replayFixtures").orElse(file("reference").absolutePath)

test {
	useJUnitPlatform()
	systemProperty "replaymod_viafabric.fixtures", replayFixtures.get()
	systemProperty "replaymod_viafabric.strict", "true"
	if (providers.gradleProperty("fullReplay").isPresent()) {
		systemProperty "replaymod_viafabric.fullReplay", "true"
	}
	maxHeapSize = "2G"
	testLogging {
		events "passed", "skipped", "failed"
		showStandardStreams = true
		exceptionFormat = "full"
	}
}

tasks.matching { it.name == "runClientGameTest" }.configureEach {
	jvmArgs "-Dreplaymod_viafabric.fixtures=${replayFixtures.get()}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
